services:
  build:
    build: .
    image: xflash-generic-build
    volumes:
      - .:/work
    working_dir: /work
    command: ["make", "build"]

  shell:
    image: xflash-generic-build
    build: .
    volumes:
      - .:/work
    working_dir: /work
    stdin_open: true
    tty: true
    command: ["bash"]
