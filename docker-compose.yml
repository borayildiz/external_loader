services:
  build:
    build: .
    image: xflash-generic-build
    volumes:
      - .:/work
    working_dir: /work
    command: ["make", "all"]

  build-flash-test:
    image: xflash-generic-build
    build: .
    volumes:
      - .:/work
    working_dir: /work
    command: ["make", "flash_test"]

  build-loader:
    image: xflash-generic-build
    build: .
    volumes:
      - .:/work
    working_dir: /work
    command: ["make", "loader"]

  shell:
    image: xflash-generic-build
    build: .
    volumes:
      - .:/work
    working_dir: /work
    stdin_open: true
    tty: true
    command: ["bash"]
